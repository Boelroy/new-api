<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Base path is injected by the Go server at serve time (REPORT_BASE_PATH).
         Empty prefix renders as href="/". With base:'./' in vite.config.ts the
         hashed assets are emitted relative (./assets/...) and resolve against
         this <base> at any route depth. -->
    <base href="__BASE_PATH__/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
